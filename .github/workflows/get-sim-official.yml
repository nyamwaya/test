on: workflow_dispatch
jobs:
  find:
    runs-on: macos-26
    steps:
      - run: find /Library/Developer/CoreSimulator -iname "*26.5*" 2>/dev/null
      - run: find /Library/Developer/CoreSimulator -iname "*.dmg" -o -iname "*.simruntime" 2>/dev/null
      - run: ls -la /Library/Developer/CoreSimulator/Images 2>/dev/null || echo "no Images dir"
      - run: ls -la /Library/Developer/CoreSimulator/Volumes 2>/dev/null || echo "no Volumes dir"
      - run: xcrun simctl runtime list -v 2>/dev/null || echo "simctl runtime subcommand not available"
